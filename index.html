<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SIDEWALK — Discover Places Around You (V1.7)</title>
  <link rel="icon" type="image/png" href="sidewalk-app-icon.png">
  <link rel="apple-touch-icon" href="sidewalk-app-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SIDEWALK">
  <meta name="theme-color" content="#062c46">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      padding: 18px 12px;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 26px rgba(0,0,0,.07);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .sub {
      text-align: center;
      color: #6b7280;
      margin: 8px 0 18px;
    }

    .status {
      padding: 12px;
      border-radius: 13px;
      background: #eef2f7;
      text-align: center;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .status.ok {
      background: #ecfdf5;
      color: #065f46;
    }

    .status.err {
      background: #fef2f2;
      color: #991b1b;
    }

    .status.loading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #startBtn {
      background: #111827;
      color: #fff;
    }

    #stopBtn {
      background: #e5e7eb;
      color: #111827;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }

    .row {
      background: #f9fafb;
      border: 1px solid #edf0f3;
      border-radius: 13px;
      padding: 11px 13px;
    }

    .label {
      font-size: 12px;
      color: #6b7280;
      display: block;
      margin-bottom: 4px;
    }

    .value {
      font-size: 17px;
      font-weight: 700;
      word-break: break-word;
    }

    .ltr {
      direction: ltr;
      text-align: left;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .address {
      font-size: 19px;
      line-height: 1.45;
    }

    #map {
      width: 100%;
      height: 360px;
      min-height: 360px;
      border-radius: 16px;
      background: #e5e7eb;
      overflow: hidden;
      position: relative;
    }

    .mapnote {
      font-size: 12px;
      color: #6b7280;
      margin: 10px 2px 0;
      line-height: 1.5;
    }

    .discover-controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
    .discover-controls select { width:100%; padding:12px; border:1px solid #dbe3ee; border-radius:12px; background:#fff; font-size:15px; }
    .discover-btn { background:#0d9488; color:white; width:100%; }
    .discover-btn:disabled { opacity:.55; }
    .map-wrap { position:relative; }
    .map-results { position:absolute; z-index:550; top:12px; right:12px; background:rgba(12,37,58,.94); color:white; border-radius:20px; padding:8px 12px; font-size:12px; font-weight:700; box-shadow:0 3px 12px #0002; pointer-events:none; }
    .poi-pin { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border:2px solid white; border-radius:50% 50% 50% 7px; transform:rotate(-45deg); box-shadow:0 2px 8px #0004; font-size:16px; }
    .poi-pin span { transform:rotate(45deg); display:block; }
    .leaflet-popup-content .poi-popup-title { font-weight:800; color:#10354c; font-size:14px; margin-bottom:5px; }
    .leaflet-popup-content .poi-popup-meta { color:#516a78; font-size:12px; margin-bottom:8px; }
    .leaflet-popup-content button { border:0; border-radius:9px; background:#0d8f98; color:white; padding:8px 12px; font-weight:700; cursor:pointer; }
    .poi-list { display:grid; gap:7px; margin-top:12px; max-height:280px; overflow:auto; }
    .poi-item { text-align:right; padding:11px; border:1px solid #e2e8f0; background:#f8fafc; border-radius:11px; font-weight:normal; }
    .poi-item strong { display:block; margin-bottom:3px; }
    .poi-item small { color:#64748b; }
    .place-details { margin-top:12px; padding:15px; border:1px solid #cbd5e1; background:#f8fafc; border-radius:15px; }
    .place-details[hidden] { display:none; }
    .place-details h3 { margin:0 0 8px; font-size:21px; }
    .place-details p { line-height:1.65; margin:8px 0; }
    .place-details img { width:100%; max-height:230px; object-fit:cover; border-radius:12px; }
    .place-details a { color:#0f766e; font-weight:bold; }
    .place-details .source { font-size:12px; color:#64748b; }
    .place-close { float:left; padding:5px 10px; font-size:14px; background:#e2e8f0; }

    .map-toolbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
    .follow-btn { background:#d1fae5; color:#065f46; padding:10px 12px; font-size:14px; }
    .follow-btn.paused { background:#e2e8f0; color:#334155; }
    .poi-info { color:#475569; font-size:13px; margin-top:10px; line-height:1.5; }
    @media (min-width: 500px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* SIDEWALK V1.6: visual design only, based on approved branding */
    :root { --navy:#082d48; --teal:#00b9bb; --sea:#0a8499; --mist:#e9f8fa; }
    body { background:linear-gradient(180deg,#d9f4f7 0,#f2f8fb 270px,#f4f8fa 100%); color:var(--navy); padding:0 12px 28px; }
    .app { max-width:680px; }
    .card { border-radius:22px; padding:17px; margin-bottom:13px; border:1px solid rgba(9,75,100,.07); box-shadow:0 5px 22px rgba(5,48,73,.075); }
    .hero { background:linear-gradient(125deg,#082b47,#075c76 75%,#0a9caa); color:#fff; margin:0 -12px 14px; padding:24px 22px 22px; border-radius:0 0 30px 30px; border:0; overflow:visible; }
    .hero-top { display:flex; align-items:center; gap:14px; direction:ltr; justify-content:center; }
    .hero-logo { width:76px; height:76px; object-fit:contain; filter:drop-shadow(0 4px 9px rgba(0,0,0,.18)); }
    .hero-copy { text-align:left; }
    .hero h1 { text-align:left; font-size:31px; letter-spacing:1px; font-weight:900; color:#fff; line-height:1.1; }
    .hero h1 span { color:#49e1db; }
    .hero .sub { color:#bcecf0; text-align:left; margin:6px 0 0; font-size:12px; letter-spacing:1.2px; font-weight:700; }
    .hero .status { margin-top:18px; background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.2); font-size:13px; font-weight:600; }
    .hero .status.ok { background:rgba(0,200,159,.23); }
    .hero .status.err { background:rgba(255,90,90,.22); }
    .hero .status.loading { background:rgba(255,255,255,.16); }
    h2 { font-size:18px; color:var(--navy); }
    .section-eyebrow { color:var(--sea); font-size:11px; letter-spacing:.7px; font-weight:800; margin:0 0 6px; }
    .buttons button { font-size:14px; padding:12px; }
    #startBtn { background:linear-gradient(100deg,#00aeb5,#0d879c); color:white; }
    #stopBtn { background:rgba(255,255,255,.93); color:var(--navy); }
    .row { background:#f1f9fb; border:1px solid #e2f0f4; }
    .value.address { font-size:16px; }
    .discover-controls select { border-color:#cce7ed; background:#f7fcfd; color:var(--navy); }
    .discover-btn { background:linear-gradient(100deg,#00b9bb,#087f99); box-shadow:0 5px 12px rgba(0,153,164,.16); }
    .poi-item { background:#f7fbfc; border-color:#e1edf1; border-right:4px solid #21bec0; transition:background .15s; }
    .poi-item:active { background:#e2f8f8; }
    .poi-item strong { color:var(--navy); }
    .follow-btn { background:#d9f8f4; color:#087f83; font-size:12px; padding:9px; }
    .follow-btn.paused { background:#eaf1f5; color:#335569; }
    #map { height:min(56vh,480px); min-height:340px; border:1px solid #d9e9ed; }
    .place-details { background:#f7fcfd; border-color:#d6eef0; }
    .place-details a { color:#008c96; }
    .place-close { color:var(--navy); }
    .poi-info,.mapnote { font-size:12px; }
    .version-tag { font-size:10px; color:#bcecf0; text-align:center; margin:10px 0 0; }
    .leaflet-container { font-family:Arial,Helvetica,sans-serif; }
    .gps-control { display:flex; justify-content:center; margin-top:10px; }
    .gps-toggle { display:flex; align-items:center; justify-content:center; gap:10px; min-width:164px; padding:12px 24px; border-radius:999px; color:white; background:linear-gradient(105deg,#00b9bb,#087f99); box-shadow:0 5px 16px rgba(0,185,187,.24); font-size:16px; direction:ltr; }
    .gps-toggle.off { background:#dce5eb; color:#24465a; box-shadow:none; }
    .gps-symbol { font-size:27px; line-height:20px; font-weight:bold; }
    .gps-toggle:focus-visible { outline:3px solid #80e8e4; outline-offset:3px; }
    @media(min-width:680px) { .hero { border-radius:0 0 30px 30px; } }
  </style>
</head>

<body>
<main class="app">

  <section class="card hero">
    <div class="hero-top"><img class="hero-logo" src="sidewalk-app-icon.png" alt="SIDEWALK logo"><div class="hero-copy"><h1>SIDE<span>WALK</span></h1><div class="sub">DISCOVER PLACES AROUND YOU</div></div></div>

    <div id="status" class="status">ממתין להפעלת המיקום</div>

    <div class="gps-control">
      <button id="gpsToggleBtn" class="gps-toggle off" type="button" aria-pressed="false" aria-label="הפעל מעקב GPS">
        <span class="gps-symbol" aria-hidden="true">⌖</span><span id="gpsToggleText">GPS OFF</span>
      </button>
    </div>
    <div class="version-tag">V1.7 · SIDEWALK</div>
  </section>

  <section class="card">
    <h2>📍 המיקום שלי</h2>

    <div class="grid">
      <div class="row wide">
        <span class="label">כתובת מלאה</span>
        <span id="fullAddress" class="value address">—</span>
      </div>

      <div class="row">
        <span class="label">מדינה</span>
        <span id="country" class="value">—</span>
      </div>

    </div>
  </section>

  <!-- נתוני GPS נשמרים פנימית לצורך תאימות הקוד, ללא הצגה במסך -->
  <div hidden aria-hidden="true">
    <span id="lat"></span><span id="lon"></span><span id="accuracy"></span>
    <span id="altitude"></span><span id="heading"></span><span id="speed"></span><span id="time"></span>
  </div>

  <section class="card">
    <h2>✨ מה יש סביבי?</h2>
    <div class="discover-controls">
      <div><label class="label" for="poiCategory">קטגוריה</label><select id="poiCategory"><option value="all">הכל</option><option value="food">🍽️ אוכל וקפה</option><option value="shopping">🛍️ קניות</option><option value="history">🏛️ היסטוריה ותרבות</option><option value="tourism">📸 אטרקציות</option></select></div>
      <div><label class="label" for="poiRadius">מרחק</label><select id="poiRadius"><option value="250">250 מטר</option><option value="500" selected>500 מטר</option><option value="1000">1,000 מטר</option></select></div>
    </div>
    <button class="discover-btn" id="discoverBtn" type="button">🔎 גלה מה סביבי</button>
    <div id="poiStatus" class="poi-info" role="status">הפעל מעקב GPS ולאחר מכן לחץ על גילוי מקומות.</div>
  </section>

  <!-- המפה מופיעה לפני רשימת המקומות -->
  <section class="card">
    <div class="map-toolbar"><h2 style="margin:0">🗺️ מפה חיה</h2><button id="followBtn" class="follow-btn" type="button">◎ עקוב אחריי: פעיל</button></div>

    <div class="map-wrap"><div id="map"></div><div id="mapResults" class="map-results" hidden aria-live="polite"></div></div>

    <div class="mapnote">
      הסמן מתעדכן כאשר המכשיר מספק מיקום חדש.
      המעגל סביב הסמן מייצג בקירוב את רמת דיוק ה-GPS.
    </div>
  </section>


  <section class="card" id="placeCard" hidden>
    <div class="place-details" id="placeDetails">
      <button class="place-close" type="button" id="closePlace">סגור ✕</button>
      <h3 id="placeTitle"></h3>
      <div id="placeBody" aria-live="polite"></div>
    </div>
  </section>

  <div id="poiList" hidden></div>


</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map = null;
  let marker = null;
  let accuracyCircle = null;
  let watchId = null;
  let firstFix = true;
  let followLocation = true;
  let programmaticMove = false;
  let lastAddressAttempt = 0;
  let addressBusy = false;
  let preferredEndpoint = 1;
  let currentPosition = null;
  let poiLayer = null;
  let poiRequest = null;
  let detailsRequest = null;

  let lastGeocodeLat = null;
  let lastGeocodeLon = null;
  let lastGeocodeTime = 0;

  const $ = (id) => document.getElementById(id);

  function valueOrNA(value) {
    return (value === null || value === undefined || Number.isNaN(value))
      ? 'לא זמין'
      : value;
  }

  function setStatus(text, type = '') {
    const el = $('status');
    el.className = 'status' + (type ? ' ' + type : '');
    el.textContent = text;
  }

  function initMap() {
    if (map) return;

    if (typeof L === 'undefined') {
      setStatus('ספריית המפה לא נטענה. בדוק חיבור לאינטרנט.', 'err');
      return;
    }

    map = L.map('map', {
      zoomControl: true,
      attributionControl: true
    }).setView([31.8, 34.9], 8);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    map.on('dragstart', () => pauseFollowing());
    map.on('zoomstart', () => { if (!programmaticMove) pauseFollowing(); });
    // חשוב במיוחד במובייל כדי ש-Leaflet יחשב נכון את גודל המפה.
    setTimeout(() => {
      if (map) map.invalidateSize();
    }, 250);
  }

  function distanceMeters(lat1, lon1, lat2, lon2) {
    if (lat2 === null || lon2 === null) return Infinity;

    const R = 6371000;
    const p = Math.PI / 180;

    const a =
      Math.sin((lat2 - lat1) * p / 2) ** 2 +
      Math.cos(lat1 * p) *
      Math.cos(lat2 * p) *
      Math.sin((lon2 - lon1) * p / 2) ** 2;

    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function pauseFollowing() {
    if (!followLocation) return;
    followLocation = false;
    updateFollowButton();
  }

  function updateFollowButton() {
    const btn = $('followBtn');
    btn.textContent = followLocation ? '◎ עקוב אחריי: פעיל' : '◎ חזור למיקום שלי';
    btn.classList.toggle('paused', !followLocation);
  }

  function centerOnUser(animate = true) {
    if (!map || !currentPosition) return;
    programmaticMove = true;
    map.panTo([currentPosition.lat, currentPosition.lon], {animate, duration:0.45});
    setTimeout(() => { programmaticMove = false; }, 700);
  }

  async function reverseGeocode(lat, lon) {
    const now = Date.now();
    const moved = distanceMeters(lat, lon, lastGeocodeLat, lastGeocodeLon);
    if (addressBusy || (moved < 40 && now - lastAddressAttempt < 45000)) return;
    lastAddressAttempt = now;
    addressBusy = true;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    try {
      const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2' +
        '&lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon) +
        '&zoom=18&addressdetails=1&accept-language=he';
      const response = await fetch(url, {signal:controller.signal, headers:{Accept:'application/json'}});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const a = data.address || {};
      const city = a.city || a.town || a.village || a.municipality || a.locality || a.county || '';
      const street = a.road || a.pedestrian || a.residential || a.footway || '';
      const line = [street, a.house_number, city].filter(Boolean).join(' ').trim();
      $('fullAddress').textContent = line || data.display_name || 'כתובת לא זמינה';
      $('country').textContent = a.country || 'לא זמין';
      lastGeocodeLat = lat;
      lastGeocodeLon = lon;
    } catch (error) {
      console.warn('Reverse geocoding error:', error);
      if (!$('fullAddress').textContent || $('fullAddress').textContent === '—') {
        $('fullAddress').textContent = 'לא ניתן לטעון כתובת כרגע';
      }
    } finally {
      clearTimeout(timer);
      addressBusy = false;
    }
  }

  function updatePosition(position) {
    const c = position.coords;
    const lat = c.latitude;
    const lon = c.longitude;
    currentPosition = { lat, lon };

    $('lat').textContent = lat.toFixed(7);
    $('lon').textContent = lon.toFixed(7);
    $('accuracy').textContent = Math.round(c.accuracy) + ' מטר';
    $('altitude').textContent =
      c.altitude == null ? 'לא זמין' : c.altitude.toFixed(1) + ' מטר';
    $('heading').textContent =
      c.heading == null ? 'לא זמין' : Math.round(c.heading) + '°';
    $('speed').textContent =
      c.speed == null ? 'לא זמין' : c.speed.toFixed(2) + ' m/s';
    $('time').textContent =
      new Date(position.timestamp).toLocaleString('he-IL');

    if (!map) {
      initMap();
    }

    if (map) {
      const point = [lat, lon];

      if (!marker) {
        marker = L.marker(point, {icon: L.icon({iconUrl:'sidewalk-gps-marker.png', iconSize:[44,50], iconAnchor:[22,49], popupAnchor:[0,-44]})})
          .addTo(map)
          .bindPopup('המיקום הנוכחי');

        accuracyCircle = L.circle(point, {
          radius: c.accuracy
        }).addTo(map);

      } else {
        marker.setLatLng(point);
        accuracyCircle
          .setLatLng(point)
          .setRadius(c.accuracy);
      }

      if (firstFix) {
        programmaticMove = true;
        map.setView(point, 17);
        setTimeout(() => { programmaticMove = false; }, 700);
        firstFix = false;

        setTimeout(() => {
          map.invalidateSize();
        }, 150);
      } else if (followLocation && map.distance(map.getCenter(), point) > 12) {
        centerOnUser();
      }
    }

    setStatus(
      'מעקב מיקום פעיל • דיוק ±' + Math.round(c.accuracy) + ' מטר',
      'ok'
    );

    reverseGeocode(lat, lon);
  }

  function handleGeoError(error) {
    const messages = {
      1: 'הרשאת המיקום נדחתה',
      2: 'המיקום אינו זמין כרגע',
      3: 'הבקשה למיקום ארכה יותר מדי זמן'
    };

    setStatus(
      messages[error.code] || 'שגיאה בקבלת המיקום',
      'err'
    );
  }

  function updateGpsToggle() {
    const active = watchId !== null;
    const button = $('gpsToggleBtn');
    button.classList.toggle('off', !active);
    button.setAttribute('aria-pressed', String(active));
    button.setAttribute('aria-label', active ? 'עצור מעקב GPS' : 'הפעל מעקב GPS');
    $('gpsToggleText').textContent = active ? 'GPS ON' : 'GPS OFF';
  }

  function startTracking() {
    if (!navigator.geolocation) {
      setStatus(
        'הדפדפן אינו תומך בשירותי מיקום',
        'err'
      );
      return;
    }

    if (watchId !== null) return;

    initMap();

    firstFix = true;
    followLocation = true;
    updateFollowButton();

    setStatus('מפעיל GPS...', 'loading');

    watchId = navigator.geolocation.watchPosition(
      updatePosition,
      (error) => {
        handleGeoError(error);

        if (error.code === 1) {
          stopTracking();
        }
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 20000
      }
    );
    updateGpsToggle();
  }

  function stopTracking() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }

    updateGpsToggle();
    setStatus('המעקב נעצר');
  }

  // Each category is a UNION of independent OSM tag filters, not an intersection.
  const poiFilters = {
    all: ['["amenity"~"^(restaurant|cafe|fast_food|bar|pub)$"]', '["shop"]', '["tourism"~"^(attraction|museum|gallery|viewpoint|artwork|information)$"]', '["historic"]'],
    food: ['["amenity"~"^(restaurant|cafe|fast_food|bar|pub)$"]'],
    shopping: ['["shop"]'],
    history: ['["historic"]', '["tourism"~"^(museum|gallery)$"]'],
    tourism: ['["tourism"~"^(attraction|museum|gallery|viewpoint|artwork|information)$"]']
  };

  function buildOverpassQuery(category, radius, lat, lon) {
    const filters = poiFilters[category] || poiFilters.all;
    const parts = filters.flatMap(filter => ['node', 'way', 'relation'].map(type =>
      `${type}(around:${radius},${lat},${lon})${filter};`));
    return `[out:json][timeout:15];(${parts.join('')});out center 180;`;
  }

  async function discoverPlaces() {
    if (!currentPosition) {
      $('poiStatus').textContent = 'יש להפעיל GPS ולהמתין לקבלת מיקום לפני החיפוש.';
      return;
    }
    if (poiRequest) poiRequest.abort();
    const controller = new AbortController();
    poiRequest = controller;
    const btn = $('discoverBtn');
    btn.disabled = true;
    $('poiStatus').textContent = 'מחפש מקומות בסביבה...';
    $('poiList').replaceChildren();
    $('mapResults').hidden = true;
    if (poiLayer) poiLayer.clearLayers();
    closePlace();
    const category = $('poiCategory').value;
    const radius = Number($('poiRadius').value);
    const {lat, lon} = currentPosition;
    const query = buildOverpassQuery(category, radius, lat, lon);
    try {
      const endpoints = [
        'https://overpass.private.coffee/api/interpreter',
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter'
      ];
      let data = null;
      let lastError = null;
      const ordered = [endpoints[preferredEndpoint - 1], ...endpoints.filter((_,i) => i !== preferredEndpoint - 1)];
      for (const endpoint of ordered) {
        if (controller.signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const attempt = new AbortController();
        const abortAttempt = () => attempt.abort();
        controller.signal.addEventListener('abort', abortAttempt, {once:true});
        const timeout = setTimeout(() => attempt.abort(), 5500);
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            body: 'data=' + encodeURIComponent(query),
            headers: {'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
            signal: attempt.signal
          });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          data = await response.json();
          preferredEndpoint = endpoints.indexOf(endpoint) + 1;
          clearTimeout(timeout);
          controller.signal.removeEventListener('abort', abortAttempt);
          break;
        } catch (error) {
          clearTimeout(timeout);
          controller.signal.removeEventListener('abort', abortAttempt);
          lastError = error;
          if (controller.signal.aborted) throw error;
          console.warn('Overpass endpoint failed:', endpoint, error);
          $('poiStatus').textContent = 'שרת החיפוש לא הגיב. מנסה שרת חלופי...';
        }
      }
      if (!data) throw lastError || new Error('No search response');
      if (poiRequest !== controller) return;
      const seen = new Set();
      const places = (data.elements || []).map(el => {
        const plat = el.lat ?? el.center?.lat;
        const plon = el.lon ?? el.center?.lon;
        const name = el.tags?.['name:he'] || el.tags?.name || el.tags?.['name:en'];
        if (!name || plat == null || plon == null) return null;
        const distance = Math.round(distanceMeters(lat, lon, plat, plon));
        return { id: el.type + '/' + el.id, name, lat:plat, lon:plon, distance,
          kind: el.tags?.amenity || el.tags?.tourism || el.tags?.historic || el.tags?.shop || 'מקום', tags:el.tags || {} };
      }).filter(Boolean).filter(place => {
        const key = place.name.toLowerCase() + ':' + Math.round(place.lat * 10000) + ':' + Math.round(place.lon * 10000);
        if (seen.has(key) || place.distance > radius) return false;
        seen.add(key); return true;
      }).sort((a,b) => a.distance - b.distance).slice(0,60);
      if (!poiLayer && map) poiLayer = L.layerGroup().addTo(map);
      const pinInfo = place => {
        if (place.tags.shop) return {emoji:'🛍️', color:'#8057bb'};
        if (place.tags.amenity) return {emoji:'☕', color:'#e18a37'};
        if (place.tags.historic || ['museum','gallery'].includes(place.tags.tourism)) return {emoji:'🏛️', color:'#3275bd'};
        return {emoji:'📸', color:'#159b83'};
      };
      for (const place of places) {
        if (!map) continue;
        const pin = pinInfo(place);
        const icon = L.divIcon({
          className:'',
          html:`<div class="poi-pin" style="background:${pin.color}"><span>${pin.emoji}</span></div>`,
          iconSize:[36,42], iconAnchor:[18,40], popupAnchor:[0,-35]
        });
        const markerPoi = L.marker([place.lat,place.lon], {icon}).addTo(poiLayer);
        const popup = document.createElement('div');
        const title = document.createElement('div'); title.className='poi-popup-title'; title.textContent=place.name;
        const meta = document.createElement('div'); meta.className='poi-popup-meta'; meta.textContent=`${place.distance} מטר · ${place.kind}`;
        const details = document.createElement('button'); details.type='button'; details.textContent='פרטים על המקום';
        details.addEventListener('click', () => { showPlace(place); map.closePopup(); });
        popup.append(title,meta,details);
        markerPoi.bindPopup(popup, {maxWidth:260});
        markerPoi.on('click', () => pauseFollowing());
      }
      if (map && places.length) {
        pauseFollowing();
        map.setView([lat,lon], radius <= 250 ? 17 : radius <= 500 ? 16 : 15);
      }
      $('mapResults').textContent = `נמצאו ${places.length} מקומות`;
      $('mapResults').hidden = false;
      $('poiStatus').textContent = places.length ? `נמצאו ${places.length} מקומות — מוצגים על המפה. לחיצה על סמל תציג פרטים.` : 'לא נמצאו מקומות מתאימים בטווח שנבחר.';
    } catch(error) {
      if (error.name !== 'AbortError') {
        console.warn('POI search failed', error);
        $('mapResults').hidden = true;
        $('poiStatus').textContent = 'חיפוש המקומות נכשל בכל שרתי החיפוש. בדוק חיבור לאינטרנט ונסה שוב. פרטים: ' + (error.message || 'שגיאת תקשורת');
      }
    } finally {
      if (poiRequest === controller) { poiRequest = null; btn.disabled = false; }
    }
  }

  function closePlace() {
    if (detailsRequest) { detailsRequest.abort(); detailsRequest = null; }
    $('placeCard').hidden = true;
  }

  function placeParagraph(text) {
    const p = document.createElement('p');
    p.textContent = text;
    $('placeBody').appendChild(p);
  }

  async function wikiAPI(lang, params, signal) {
    const url = new URL(`https://${lang}.wikipedia.org/w/api.php`);
    Object.entries({action:'query', format:'json', origin:'*', ...params}).forEach(([k,v])=>url.searchParams.set(k,v));
    const res = await fetch(url, {signal});
    if (!res.ok) throw new Error('Wikipedia HTTP '+res.status);
    return res.json();
  }

  async function showPlace(place) {
    if (detailsRequest) detailsRequest.abort();
    const controller = new AbortController();
    detailsRequest = controller;
    $('placeCard').hidden = false;
    $('placeTitle').textContent = place.name;
    $('placeBody').replaceChildren();
    placeParagraph('מחפש מידע ותמונה על המקום...');
    $('placeCard').scrollIntoView({behavior:'smooth',block:'start'});
    try {
      // Use a direct Wikipedia link when OSM provides one; otherwise search by name.
      const direct = place.tags.wikipedia || place.tags['wikipedia:he'] && 'he:'+place.tags['wikipedia:he'];
      let lang = 'he', title = null;
      if (direct && direct.includes(':')) {
        const split = direct.indexOf(':');
        lang = direct.slice(0,split).toLowerCase(); title = direct.slice(split+1);
        if (!['he','en'].includes(lang)) { lang = 'he'; title = null; }
      }
      async function getPage(language, pageTitle) {
        let data;
        if (pageTitle) {
          data = await wikiAPI(language, {prop:'extracts|pageimages|info',inprop:'url',exintro:'1',explaintext:'1',exchars:'950',piprop:'thumbnail',pithumbsize:'700',redirects:'1',titles:pageTitle}, controller.signal);
        } else {
          data = await wikiAPI(language, {generator:'search',gsrsearch:place.name,gsrlimit:'1',prop:'extracts|pageimages|info',inprop:'url',exintro:'1',explaintext:'1',exchars:'950',piprop:'thumbnail',pithumbsize:'700'}, controller.signal);
        }
        return Object.values(data.query?.pages || {})[0];
      }
      let page = await getPage(lang,title);
      if ((!page || page.missing !== undefined || !page.extract) && lang === 'he') page = await getPage('en',null);
      if (controller.signal.aborted) return;
      $('placeBody').replaceChildren();
      // Search results are not necessarily the same place: require name match or direct OSM link.
      const normalized = str => (str||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
      const match = page && (title || normalized(page.title).includes(normalized(place.name)) || normalized(place.name).includes(normalized(page.title)));
      if (page?.extract && match) {
        if (page.thumbnail?.source) {
          const img = document.createElement('img'); img.src = page.thumbnail.source;
          img.alt = 'תמונה מתוך ויקיפדיה: '+page.title; img.loading='lazy';
          $('placeBody').appendChild(img);
        }
        placeParagraph(page.extract);
        if (page.fullurl) {
          const a = document.createElement('a'); a.href=page.fullurl; a.target='_blank'; a.rel='noopener noreferrer';
          a.textContent='קרא עוד בוויקיפדיה ↗'; $('placeBody').appendChild(a);
        }
        const source=document.createElement('p'); source.className='source';
        source.textContent='מקור: ויקיפדיה. המידע עשוי להיות בשפה המקורית.'; $('placeBody').appendChild(source);
      } else {
        placeParagraph(place.tags.description || place.tags['description:he'] || 'לא נמצא כרגע הסבר אנציקלופדי מאומת למקום זה.');
        placeParagraph(`סוג מקום: ${place.kind} · מרחק בקו אווירי: ${place.distance} מטר`);
        const source=document.createElement('p'); source.className='source'; source.textContent='פרטי המקום: OpenStreetMap'; $('placeBody').appendChild(source);
      }
    } catch (error) {
      if (controller.signal.aborted) return;
      $('placeBody').replaceChildren();
      placeParagraph('לא ניתן כרגע לטעון מידע מוויקיפדיה. נסה שוב מאוחר יותר.');
      placeParagraph(`סוג מקום: ${place.kind} · מרחק: ${place.distance} מטר`);
    } finally {
      if (detailsRequest === controller) detailsRequest = null;
    }
  }
  $('followBtn').addEventListener('click', () => {
    followLocation = true;
    updateFollowButton();
    centerOnUser();
  });
  $('closePlace').addEventListener('click', closePlace);

  $('discoverBtn').addEventListener('click', discoverPlaces);
  $('gpsToggleBtn').addEventListener('click', () => {
    if (watchId === null) startTracking(); else stopTracking();
  });

  window.addEventListener('load', () => {
    initMap();
    startTracking(); // ניסיון הפעלה אוטומטית, בכפוף להרשאת מיקום

    setTimeout(() => {
      if (map) map.invalidateSize();
    }, 500);
  });

  window.addEventListener('resize', () => {
    if (map) {
      setTimeout(() => map.invalidateSize(), 100);
    }
  });
</script>
</body>
</html>
